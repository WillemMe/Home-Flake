input {
  # Remap Capslock -> Esc for Vim users
  kb_options=caps:escape
  repeat_rate=50
  repeat_delay=240
  numlock_by_default=1

  touchpad {
    disable_while_typing=1
    natural_scroll=1
    clickfinger_behavior=1
    middle_button_emulation=0
    tap-to-click=1
    tap_button_map = "LMR"
  }
}


gesture = 3, horizontal, workspace
general {
    layout=dwindle
#    sensitivity=1.0 # for mouse cursor

    gaps_in=5
    gaps_out=5
    border_size=1
    col.active_border=0xff5e81ac
    col.inactive_border=0x66333333

#    apply_sens_to_raw=0 # whether to apply the sensitivity to raw input (e.g. used by games where you aim using your mouse)
}

decoration {
    rounding=18
    #blur=1
    #blur_size=6.8 # minimum 1
    #blur_passes=2 # minimum 1, more passes = more resource intensive.
    #blur_new_optimizations = true
    # Your blur "amount" is blur_size * blur_passes, but high blur_size (over around 5-ish) will produce artifacts.
    # if you want heavy blur, you need to up the blur_passes.
    # the more passes, the more you can up the blur_size without noticing artifacts.
#    drop_shadow=true
#    shadow_range=10
#    col.shadow=0xffa7caff
#    col.shadow_inactive=0x50000000
}

# Blur for waybar
#blurls=waybar
blurls=lockscreen

# Blur + disable layer animations for Noctalia's own surfaces (bar, panels,
# dock, osd, notifications, window-switcher) so they don't fight Noctalia's
# own animations. Syntax translated from the Noctalia docs' Lua snippet to
# this Hyprland build's `match:` layerrule syntax — NOT verified against a
# running instance. If `hyprctl reload` reports a parse error here, check
# https://wiki.hypr.land/Configuring/Basics/Window-Rules/ for the current
# layerrule action keywords (blur/blur_popups/ignore_alpha/no_anim) on this
# Hyprland version.
layerrule = match:namespace ^(noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher))$, blur on
layerrule = match:namespace ^(noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher))$, blur_popups on
layerrule = match:namespace ^(noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher))$, ignore_alpha 0.5
layerrule = match:namespace ^(noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher))$, no_anim on

animations {
    enabled=1
    # bezier=overshot,0.05,0.9,0.1,1.1
    bezier=overshot,0.13,0.99,0.29,1.1
    bezier=easeCubic,0.33, 1, 0.68, 1
    animation=windows,1,4,overshot,slide
    animation=fade,1,10,default
    animation=workspaces,1,6,overshot,slide
    animation=border,1,10,default
}

dwindle {
    # force_split=2
    force_split=0
#    no_gaps_when_only = 1
    preserve_split=true
}

master {
  new_on_top=true
#  no_gaps_when_only = false
}

misc {
  disable_hyprland_logo=true
  disable_splash_rendering=true
  mouse_move_enables_dpms=true
  #no_vfr=1
  focus_on_activate = true
}


