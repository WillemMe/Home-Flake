# Status bar
exec-once=~/.config/eww/launch

#Notification
#exec-once=dunst

#Polkit 
exec-once=/usr/lib/polkit-kde-authentication-agent-1
# Wallpaper

exec-once=noctalia
#Mount shares when local
#exec-once=~/.config/hypr/scripts/shares.sh

#exec-once=nm-applet
exec-once=voxtype


# For lockscreen
#exec-once=swayidle -w timeout 2000 'swaylock-fancy'
#exec-once=hypridle -q

#For clipboard
#Stores only text data
exec-once = wl-paste --type text --watch cliphist store -max-items 5 
#Stores only image data
exec-once = wl-paste --type image --watch cliphist store -max-items 5

#exec-once=otd-daemon

# Bluetooth
#exec-once=blueman-applet # Make sure you have installed blueman

# Screen Sharing
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Starts graphical-session.target itself — without this, nothing bound to it
# (e.g. noctalia.service, which is WantedBy/PartOf=graphical-session.target)
# ever activates, even though the env vars above are imported correctly.
exec-once=systemctl --user start graphical-session.target
#exec-once=~/.config/hypr/scripts/screensharing.sh

#Nextclound
exec-once=nextcloud --background

## Move to workspace 1
exec-once=hyprctl dispatch workspace 2
